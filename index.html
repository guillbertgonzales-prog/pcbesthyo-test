<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo de Productos - PC Best Huancayo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url(
            'https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap'
        );

        body,
        button,
        input,
        select,
        textarea {
            font-family: 'Montserrat', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .font-display,
        .font-display * {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        body {
            letter-spacing: -0.01em;
        }

        .formal-text {
            font-family: 'Montserrat', sans-serif !important;
            font-weight: 500;
            letter-spacing: -0.005em;
        }

        .formal-heading {
            font-family: 'Montserrat', sans-serif !important;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.5);
            border-radius: 9999px;
            transition: background 0.3s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.8);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media print {
            body {
                background-color: white !important;
                color: black !important;
            }

            header,
            #topStoreBanner,
            footer,
            .fixed,
            button,
            #categorias,
            section.relative:first-of-type .max-w-xl {
                display: none !important;
            }

            #productGrid {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 20px !important;
            }

            #productGrid > div {
                break-inside: avoid;
                border: 1px solid #cbd5e1 !important;
                background: white !important;
                box-shadow: none !important;
            }

            #productGrid img {
                height: 220px !important;
                object-fit: contain !important;
                background: #f8fafc !important;
            }

            #productGrid h3,
            #productGrid p,
            #productGrid span {
                color: #0f172a !important;
            }
        }

        /* ================================
           VENDEDOR PC BEST
        ================================= */

        .catalog-with-advisor {
            display: grid;
            grid-template-columns: 270px minmax(0, 1fr);
            gap: 1.5rem;
            align-items: start;
        }

        .pcbest-advisor {
            position: sticky;
            top: 90px;
            background:
                linear-gradient(
                    180deg,
                    rgba(11, 19, 41, .98),
                    rgba(3, 7, 18, .98)
                );
            border: 1px solid rgba(14, 165, 233, .28);
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow:
                0 20px 60px rgba(2, 132, 199, .12);
        }

        .pcbest-advisor-media {
            height: 310px;
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(14, 165, 233, .18),
                    transparent 55%
                ),
                #030712;

            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
        }

        .pcbest-advisor-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transition: transform .6s ease;
        }

        .pcbest-advisor:hover
        .pcbest-advisor-media img {
            transform: scale(1.035);
        }

        .pcbest-advisor-body {
            padding: 1rem 1.05rem 1.15rem;
        }

        .pcbest-advisor-badge {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            background: rgba(14, 165, 233, .12);
            color: #67e8f9;
            border: 1px solid rgba(14, 165, 233, .25);
            border-radius: 999px;
            padding: .35rem .65rem;
            font-size: .65rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .pcbest-advisor-title {
            color: #fff;
            font-weight: 900;
            font-size: 1rem;
            margin-top: .65rem;
        }

        .pcbest-advisor-text {
            color: #94a3b8;
            font-size: .72rem;
            line-height: 1.5;
            margin-top: .35rem;
        }

        .pcbest-advisor-cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            width: 100%;
            margin-top: .85rem;
            padding: .7rem .8rem;
            border-radius: .8rem;
            background: linear-gradient(
                135deg,
                #0ea5e9,
                #2563eb
            );
            color: #fff;
            font-size: .72rem;
            font-weight: 900;
            box-shadow:
                0 10px 25px rgba(14, 165, 233, .18);
        }

        @media (max-width: 1023px) {
            .catalog-with-advisor {
                grid-template-columns: 1fr;
            }

            .pcbest-advisor {
                position: relative;
                top: auto;
                display: grid;
                grid-template-columns: 180px minmax(0, 1fr);
                align-items: center;
            }

            .pcbest-advisor-media {
                height: 240px;
            }
        }

        @media (max-width: 639px) {
            .pcbest-advisor {
                grid-template-columns: 1fr;
            }

            .pcbest-advisor-media {
                height: 280px;
            }
        }

        /* ================================
           ADMIN
        ================================= */

        .admin-nav-btn {
            display: flex;
            align-items: center;
            gap: .5rem;
            white-space: nowrap;
            padding: .7rem .95rem;
            border: 1px solid transparent;
            border-radius: .85rem;
            color: #94a3b8;
            background: transparent;
            font-size: .72rem;
            font-weight: 800;
            transition: all .2s;
        }

        .admin-nav-btn:hover {
            color: #fff;
            background: #0b1329;
            border-color: #164e63;
            transform: translateY(-1px);
        }

        .admin-nav-btn.active {
            color: #67e8f9;
            background:
                linear-gradient(
                    135deg,
                    rgba(14, 165, 233, .18),
                    rgba(37, 99, 235, .08)
                );
            border-color: rgba(14, 165, 233, .35);
            box-shadow:
                0 8px 25px rgba(14, 165, 233, .08);
        }

        .admin-module {
            animation: adminFade .22s ease;
        }

        @keyframes adminFade {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .admin-field-label {
            display: block;
            margin-bottom: .4rem;
            color: #94a3b8;
            font-size: .68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .admin-field {
            width: 100%;
            background: #0b1329;
            border: 1px solid #172554;
            border-radius: .8rem;
            padding: .75rem 1rem;
            color: #f1f5f9;
            font-size: .78rem;
            outline: none;
            transition: .2s;
        }

        .admin-field:focus {
            border-color: #22d3ee;
            box-shadow:
                0 0 0 3px rgba(34, 211, 238, .08);
        }
    </style>

    <style>
        /* =================================
           FONDOS FLOTANTES PC BEST
        ================================= */

        .floating-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .floating-bg .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: .22;
            mix-blend-mode: screen;
            animation: floatOrb 16s ease-in-out infinite;
        }

        .floating-bg .orb:nth-child(1) {
            width: 260px;
            height: 260px;
            left: -70px;
            top: 12%;
            background:
                radial-gradient(
                    circle,
                    rgba(34, 211, 238, .42),
                    transparent 68%
                );
            animation-duration: 18s;
        }

        .floating-bg .orb:nth-child(2) {
            width: 340px;
            height: 340px;
            right: -100px;
            top: 28%;
            background:
                radial-gradient(
                    circle,
                    rgba(59, 130, 246, .34),
                    transparent 68%
                );
            animation-duration: 22s;
            animation-delay: -5s;
        }

        .floating-bg .orb:nth-child(3) {
            width: 210px;
            height: 210px;
            left: 30%;
            bottom: -70px;
            background:
                radial-gradient(
                    circle,
                    rgba(14, 165, 233, .28),
                    transparent 68%
                );
            animation-duration: 20s;
            animation-delay: -9s;
        }

        .floating-bg .orb:nth-child(4) {
            width: 170px;
            height: 170px;
            right: 25%;
            top: 8%;
            background:
                radial-gradient(
                    circle,
                    rgba(125, 211, 252, .22),
                    transparent 68%
                );
            animation-duration: 15s;
            animation-delay: -3s;
        }

        .floating-bg .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(125, 211, 252, .72);
            box-shadow:
                0 0 14px rgba(34, 211, 238, .8);
            animation: drift linear infinite;
        }

        @keyframes floatOrb {
            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(35px, -45px, 0)
                    scale(1.08);
            }
        }

        @keyframes drift {
            0% {
                transform:
                    translate3d(0, 80px, 0);
                opacity: 0;
            }

            15% {
                opacity: .8;
            }

            50% {
                transform:
                    translate3d(35px, -35px, 0);
                opacity: .55;
            }

            85% {
                opacity: .8;
            }

            100% {
                transform:
                    translate3d(-25px, -140px, 0);
                opacity: 0;
            }
        }

        @keyframes lightSweep {
            0% {
                transform:
                    translateY(-120px)
                    rotate(35deg);
                opacity: 0;
            }

            25% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(35deg);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .floating-bg * {
                animation: none !important;
            }
        }
    </style>

    <!-- Pantalla de bienvenida -->
    <style id="pcbest-intro-style">
        #pcbestIntro {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(14, 165, 233, .16),
                    transparent 34%
                ),
                linear-gradient(
                    135deg,
                    #020617 0%,
                    #06152e 48%,
                    #020617 100%
                );

            color: #fff;
            transition:
                opacity .9s ease,
                visibility .9s ease;
        }

        #pcbestIntro::before {
            content: "";
            position: absolute;
            width: 55vw;
            height: 55vw;
            max-width: 760px;
            max-height: 760px;
            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(34, 211, 238, .16),
                    rgba(37, 99, 235, .07) 38%,
                    transparent 70%
                );

            animation: introPulse 3s ease-in-out infinite;
        }

        #pcbestIntro::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    115deg,
                    transparent 35%,
                    rgba(255,255,255,.055) 50%,
                    transparent 65%
                );

            transform: translateX(-120%);
            animation: introSweep 2.8s linear infinite;
        }
    </style>
